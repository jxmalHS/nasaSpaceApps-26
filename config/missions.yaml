# Mission profiles (step 1 of the pipeline). Every condition is sorted into:
#   target       - must match the Moon/Mars target; the weight says how much it matters
#   ignored      - doesn't matter for this test
#   interference - would ruin the test (Earth land cover); share of a tile, 0-1, with a limit
# mandatory: pass/fail rules set BEFORE ranking. max_abs_diff = "within X of the target";
#            max / min = fixed limits. Unknown (no data) is never a pass.
#
# All weights and limits are EXAMPLE values chosen by the engine team,
# not official NASA requirements.

# --- Rover weights (moon_rover_south_pole, moon_rover_mons_mouton) -------------------
# No published source gives "weights"; they rank measurements by how directly they tie
# to a published rover limit. The limits:
#   - VIPER generally drives slopes up to 15 deg; 25-30 deg possible but slip increases
#     (NASA, science.nasa.gov/mission/viper/lunar-operations)
#   - Apollo LRV climbed/descended slopes of ~25 deg, crossed 30 cm obstacles
#     (NASA SP-350 "Apollo Expeditions to the Moon", ch. 14.8)
#   - Apollo 15/16 traverses: max slope 22.1 / 24.7 deg, mean 5.6 / 4.5 deg
#     (NASA LPSC abstract, ntrs.nasa.gov/citations/20250011301)
# frac_steep (share of ground over 15 deg) = VIPER's normal driving limit  -> 2.0, highest
# slope_p90  (steepest 10%), vs the 22-25 deg Apollo/VIPER maximum          -> 1.5
# slope_mean, vs the 4.5-5.6 deg mean of real driven traverses             -> 1.0
# pit_density: craters were driven around, but no published limit         -> 0.5
# rough_small / rough_large: 500 m / 2.5 km bumpiness; no rover limit at
#   these scales (30 cm rocks are invisible at 100 m pixels)                -> 0.5 / 0.3
# Caveat: slopes from 100 m pixels are gentler than what a wheel feels at 1 m.
moon_rover_south_pole:
  description: >-
    Rover wheels / astronaut surface mobility at the lunar south pole. Weighted toward
    published rover slope limits (VIPER 15 deg normal, ~25 deg maximum). Rocks the size a
    wheel must cross (~30 cm) are NOT measured: they are invisible at 100 m pixels.
  body: moon
  target: lunar_south_pole
  features:
    target:
      frac_steep: 2.0
      slope_p90: 1.5
      slope_mean: 1.0
      pit_density: 0.5
      rough_small: 0.5
      rough_large: 0.3
    ignored: [slope_std, relief, hypsometric_integral, curvature_abs_mean,
              grass_shrub_frac, bare_frac, temp_range_mean, temp_range_std, minerals]
    interference:
      tree_frac: {max: 0.3}
      cropland_frac: {max: 0.2}
      builtup_frac: {max: 0.1}
      snow_ice_frac: {max: 0.1}
      water_frac: {max: 0.05}
  mandatory:
    - {feature: slope_p90, max_abs_diff: 5.0, unit: deg}
    - {feature: frac_steep, max_abs_diff: 0.10, unit: fraction}
    - {feature: rough_small, max_abs_diff: 3.0, unit: m}

moon_rover_mons_mouton:
  description: >-
    Same rover-wheel test as moon_rover_south_pole, but the target is the Mons Mouton
    plateau (VIPER / IM-2 landing area): the gentler ground a rover would really drive on,
    instead of a box round the pole that includes Shackleton crater's steep walls.
    Weights as moon_rover_south_pole (published rover slope limits); ~30 cm rocks NOT measured.
  body: moon
  target: mons_mouton
  features:
    target:
      frac_steep: 2.0
      slope_p90: 1.5
      slope_mean: 1.0
      pit_density: 0.5
      rough_small: 0.5
      rough_large: 0.3
    ignored: [slope_std, relief, hypsometric_integral, curvature_abs_mean,
              grass_shrub_frac, bare_frac, temp_range_mean, temp_range_std, minerals]
    interference:
      tree_frac: {max: 0.3}
      cropland_frac: {max: 0.2}
      builtup_frac: {max: 0.1}
      snow_ice_frac: {max: 0.1}
      water_frac: {max: 0.05}
  mandatory:
    - {feature: slope_p90, max_abs_diff: 5.0, unit: deg}
    - {feature: frac_steep, max_abs_diff: 0.10, unit: fraction}
    - {feature: rough_small, max_abs_diff: 3.0, unit: m}

moon_landing_hazards_south_pole:
  description: >-
    Lander hazard-detection cameras / landing-site survey: crater-like dips,
    curvature and overall relief matter most; fine slope detail matters less.
  body: moon
  target: lunar_south_pole
  features:
    target:
      pit_density: 2.0
      curvature_abs_mean: 1.5
      relief: 1.0
      hypsometric_integral: 1.0
      rough_large: 0.5
    ignored: [slope_mean, slope_std, slope_p90, frac_steep, rough_small,
              grass_shrub_frac, bare_frac, cropland_frac, temp_range_mean, temp_range_std, minerals]
    interference:
      tree_frac: {max: 0.2}
      builtup_frac: {max: 0.1}
      snow_ice_frac: {max: 0.1}
      water_frac: {max: 0.05}
  mandatory:
    - {feature: pit_density, max_abs_diff: 0.5, unit: per_km2}
    - {feature: relief, max_abs_diff: 150, unit: m}

moon_rover_thermal_south_pole:
  description: >-
    Rover field test needing BOTH a strong terrain match and the widest temperature
    swings Earth can offer (thermal cycling of wheels, motors and batteries).
    Terrain counts about twice as much as temperature.
  body: moon
  target: lunar_south_pole
  features:
    target:
      slope_mean: 1.0
      slope_p90: 1.0
      frac_steep: 0.5
      rough_small: 1.0
      rough_large: 0.5
      temp_range_mean: 2.0
    ignored: [slope_std, relief, hypsometric_integral, curvature_abs_mean, pit_density,
              temp_range_std, grass_shrub_frac, bare_frac, minerals]
    interference:
      tree_frac: {max: 0.3}
      cropland_frac: {max: 0.2}
      builtup_frac: {max: 0.1}
      snow_ice_frac: {max: 0.1}
      water_frac: {max: 0.05}
  mandatory:
    - {feature: slope_p90, max_abs_diff: 5.0, unit: deg}
    - {feature: temp_range_mean, min: 60, unit: K}
